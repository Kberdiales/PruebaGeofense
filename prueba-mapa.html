<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofence Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css"/>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>

<script>

    // Inicializar mapa
    const map = L.map('map').setView(
        [8.9824, -79.5199],
        12
    );
	
	let currentLayer = null;

    // OpenStreetMap HOT
    L.tileLayer(
        'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 20
        }
    ).addTo(map);

    // Controles Geoman
    map.pm.addControls({
        position: 'topleft',

        drawPolygon: true,
        drawRectangle: true,

        drawMarker: false,
        drawCircle: false,
        drawCircleMarker: false,
        drawPolyline: false,

        editMode: true,
        dragMode: true,
        removalMode: true
    });

    // Función para enviar GeoJSON a Creatio
    function enviarGeoJson(layer) {

        const geojson =
            JSON.stringify(
                layer.toGeoJSON()
            );

        console.log("GeoJSON:");
        console.log(geojson);

        window.parent.postMessage({
            type: "polygon_created",
            geojson: geojson
        }, "*");
    }
	
	window.addEventListener(
    "message",
    function(event) {

        if (
            event.data &&
            event.data.type === "load_polygon"
        ) {

            try {

                const geojson =
                    JSON.parse(
                        event.data.geojson
                    );

                // Eliminar polígono actual
                if (currentLayer) {
                    map.removeLayer(currentLayer);
                }

                // Dibujar polígono
currentLayer =
    L.geoJSON(geojson)
     .addTo(map);

currentLayer.eachLayer(function(layer) {

    layer.pm.enable();

    layer.on('pm:edit', function() {
        enviarGeoJson(layer);
    });

});

                // Ajustar zoom
                map.fitBounds(
                    currentLayer.getBounds()
                );

                console.log(
                    "Polígono cargado"
                );

            } catch(ex) {

                console.error(
                    "Error cargando polígono",
                    ex
                );

            }
        }
    }
);

    // Cuando se crea un polígono
    map.on('pm:create', function(e) {

const layer = e.layer;

// Eliminar polígono anterior
if (currentLayer) {
    map.removeLayer(currentLayer);
}

currentLayer = layer;

layer.pm.enable();

// Guardar GeoJSON
enviarGeoJson(layer);

layer.on('pm:edit', function() {
    enviarGeoJson(layer);
});



window.parent.postMessage({
    type: "get_polygon"
}, "*");

</script>

</body>
</html>
