<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ban-map" content="BAN-GEOFENSE-MAP">
    <title>Geofence Map - Panamá (v4)</title>

    <!-- Reduce el tiempo de conexión a recursos externos. -->
    <link rel="preconnect" href="https://api.maptiler.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdn.maptiler.com" crossorigin>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            position: relative;
            width: 100%;
            height: 100%;
            background: #eef2f4;
        }

        #map-status {
            position: absolute;
            z-index: 1000;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.94);
            color: #334155;
            font: 14px/1.4 Arial, sans-serif;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
        }

        #map-status[hidden] {
            display: none;
        }

        /* --- Búsqueda con autocompletado --------------------------------- */
        #search-status {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            max-width: min(72%, 480px);
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 1px 6px rgba(0, 0, 0, .18);
            font: 12px/1.4 Arial, sans-serif;
            color: #334155;
            text-align: center;
        }

        #search-status[data-tone="ok"] {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        #search-status[data-tone="error"] {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        #search-status[hidden] {
            display: none;
        }

        .ban-search-marker span {
            position: relative;
            display: block;
            width: 22px;
            height: 22px;
            margin: 2px auto 0;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: #e11d48;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
        }

        .ban-search-marker span::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: #fff;
        }

        .ban-search-popup strong {
            display: block;
            font: 600 12px/1.35 Arial, sans-serif;
            color: #0f172a;
        }

        .ban-search-detail {
            margin-top: 2px;
            font: 11px/1.35 Arial, sans-serif;
            color: #475569;
        }

        .ban-search-coords {
            margin-top: 2px;
            font: 11px/1.3 ui-monospace, Consolas, monospace;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div id="map">
        <div id="map-status" role="status" aria-live="polite">Cargando geocerca…</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.maptiler.com/maptiler-geocoding-control/v3.1.0/leaflet.umd.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>

    <script>
        // Centro inicial del mapa: Leaflet recibe [latitud, longitud].
        const PANAMA = [8.9824, -79.5199];
        const GEOJSON_FIELD = "BANCoordenadas";
        // MapTiler Streets ofrece una capa vial detallada y CDN. La clave debe
        // limitarse al origen que sirve este iframe (p. ej. kberdiales.github.io).
        const MAPTILER_API_KEY = "hXjIz6qVSNRoIyA5iv2i";
        // Una key "presente" es la única condición. No se compara contra un
        // literal: así un find/replace de la key no desactiva el mapa ni el buscador.
        const USE_MAPTILER = MAPTILER_API_KEY.length > 0;
        // Desarrollo local: único caso donde se permite otra capa base (CARTO).
        const IS_LOCAL_DEV = location.protocol === "file:" ||
            ["localhost", "127.0.0.1"].includes(location.hostname);
        const DEBUG = false;

        const map = L.map("map", {
            preferCanvas: true,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView(PANAMA, 8);

        const mapStatus = document.getElementById("map-status");
        let basemapAdded = false;
        let initialDataReceived = false;
        let initialRequestAttempts = 0;
        let initialRequestTimer = null;
        let basemapLoadTimeout = null;
        let basemapTileErrors = 0;

        const MAPTILER_ATTRIBUTION =
            '<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">© MapTiler</a> ' +
            '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>';

        const CARTO_ATTRIBUTION =
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ' +
            '&copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';

        // Capas base permitidas:
        //  - CARTO en localhost/file: (desarrollo). Se prioriza para que el mapa
        //    siempre renderice aunque la key esté restringida a otro dominio.
        //  - MapTiler cuando hay key (producción).
        //  - Ninguna en cualquier otro caso: NO se usan los servidores voluntarios
        //    de OpenStreetMap desde una aplicación (política de uso de la OSMF).
        const basemap = IS_LOCAL_DEV
            ? L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
                subdomains: "abcd",
                minZoom: 1,
                maxZoom: 20,
                updateWhenIdle: true,
                keepBuffer: 2,
                attribution: CARTO_ATTRIBUTION
            })
            : USE_MAPTILER
                ? L.tileLayer(
                    `https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${encodeURIComponent(MAPTILER_API_KEY)}`,
                    {
                        tileSize: 512,
                        zoomOffset: -1,
                        minZoom: 1,
                        maxZoom: 21,
                        maxNativeZoom: 21,
                        crossOrigin: true,
                        updateWhenIdle: true,
                        keepBuffer: 2,
                        attribution: MAPTILER_ATTRIBUTION
                    }
                )
                : null;

        function addBasemap() {
            if (basemapAdded) return;

            if (!basemap) {
                map.getContainer().style.background = "#eef2f4";
                if (mapStatus) {
                    mapStatus.hidden = false;
                    mapStatus.textContent = "Configura MAPTILER_API_KEY para mostrar el mapa base.";
                }
                basemapAdded = true;
                return;
            }

            if (mapStatus) {
                mapStatus.hidden = false;
                mapStatus.textContent = "Cargando mapa…";
            }
            basemap.on("load", hideMapStatus);
            basemap.on("tileerror", () => {
                basemapTileErrors++;
                if (basemapTileErrors >= 3 && mapStatus) {
                    mapStatus.hidden = false;
                    mapStatus.textContent = USE_MAPTILER
                        ? "No se pudieron cargar las teselas. Revisa la clave de MapTiler y su restricción de dominio."
                        : "No se pudieron cargar las teselas del mapa base de desarrollo. Revisa la conexión.";
                }
            });
            basemap.addTo(map);
            basemapAdded = true;
            basemapLoadTimeout = setTimeout(() => {
                if (mapStatus && !mapStatus.hidden) {
                    mapStatus.textContent = "El mapa tarda en responder. Revisa la conexión o el proveedor de teselas.";
                }
            }, 12000);
        }

        function hideMapStatus() {
            if (basemapLoadTimeout) {
                clearTimeout(basemapLoadTimeout);
                basemapLoadTimeout = null;
            }
            if (mapStatus) mapStatus.hidden = true;
        }

        function finishInitialLoadWithoutGeometry() {
            if (initialDataReceived) return;
            initialDataReceived = true;
            if (initialRequestTimer) {
                clearInterval(initialRequestTimer);
                initialRequestTimer = null;
            }
            map.setView(PANAMA, 8, { animate: false });
            addBasemap();
        }

        let currentLayer = null;
        let currentWasFeatureCollection = false;
        let clearingLayers = false;

        // Usa el origen del contenedor cuando el navegador informa el referrer.
        // Para producción, se recomienda configurar un origen fijo de Creatio.
        const CREATIO_ORIGIN = (() => {
            try {
                const origin = new URL(document.referrer).origin;
                return origin && origin !== "null" ? origin : "*";
            } catch (_) {
                return "*";
            }
        })();

        // Una página abierta directamente no tiene contenedor Creatio al que preguntar.
        function isEmbedded() {
            try {
                return window.parent !== window;
            } catch (_) {
                return false;
            }
        }

        console.log("[Creatio GeoJSON] Mapa inicializado", {
            center: PANAMA,
            fieldName: GEOJSON_FIELD,
            parentOrigin: CREATIO_ORIGIN,
            basemap: IS_LOCAL_DEV
                ? "CARTO Voyager (desarrollo local)"
                : (USE_MAPTILER ? "MapTiler Streets v4" : "ninguna"),
            embedded: isEmbedded()
        });
        if (!USE_MAPTILER) {
            console.warn(
                IS_LOCAL_DEV
                    ? "[Creatio GeoJSON] Sin MAPTILER_API_KEY: se usa CARTO Voyager solo para desarrollo local."
                    : "[Creatio GeoJSON] Sin MAPTILER_API_KEY: no se cargará mapa base. No se usa OpenStreetMap público."
            );
        }

        // Evita tamaños incorrectos al abrir o redimensionar la pestaña de Creatio.
        if (typeof ResizeObserver !== "undefined") {
            const mapResizeObserver = new ResizeObserver(() => {
                map.invalidateSize({ pan: false, animate: false });
            });
            mapResizeObserver.observe(document.getElementById("map"));
        }

        // Conserva Polygon, Rectangle y Circle del HTML de GitHub y habilita Point.
        map.pm.addControls({
            position: "topleft",
            drawPolygon: true,
            drawRectangle: true,
            drawMarker: false,
            drawCircle: true,
            drawCircleMarker: false,
            drawPolyline: false,
            editMode: true,
            dragMode: true,
            removalMode: true
        });

        /* =====================================================================
         * BÚSQUEDA CON AUTOCOMPLETADO — MapTiler Geocoding Control
         * - Sugerencias mientras se escribe (debounce + minLength).
         * - Al elegir una sugerencia: pin propio + encuadre del mapa.
         * - El pin vive en `searchLayer`, NUNCA en `currentLayer`:
         *   serializeCurrentGeoJson() no lo ve y BANCoordenadas no cambia.
         * ===================================================================== */

        const SEARCH_CONFIG = {
            apiKey: MAPTILER_API_KEY,
            language: "es",
            country: "pa",              // "pa" | "" (mundial) | ["pa","cr"]
            limit: 5,
            minLength: 2,
            debounceSearch: 300,        // ms entre pausas de escritura y consulta
            maxZoom: 17,                // evita zoom excesivo en POI
            fitPadding: [28, 28],
            position: "topright",       // Geoman usa topleft: no se solapan
            biasToMapCenter: true,      // prioriza resultados cerca del encuadre
            types: null                 // null = todos; p. ej. ["address","poi","place"]
        };

        const searchLayer = L.layerGroup().addTo(map);
        let geocodingControl = null;
        let searchStatusTimer = null;

        const searchStatusEl = (() => {
            const element = document.createElement("div");
            element.id = "search-status";
            element.setAttribute("role", "status");
            element.setAttribute("aria-live", "polite");
            element.hidden = true;
            document.body.appendChild(element);
            return element;
        })();

        function setSearchStatus(text, tone) {
            if (!searchStatusEl) return;
            if (searchStatusTimer) {
                clearTimeout(searchStatusTimer);
                searchStatusTimer = null;
            }
            if (!text) {
                searchStatusEl.hidden = true;
                searchStatusEl.textContent = "";
                return;
            }
            searchStatusEl.hidden = false;
            searchStatusEl.textContent = text;
            searchStatusEl.dataset.tone = tone || "info";
            if (tone === "ok") {
                searchStatusTimer = setTimeout(() => setSearchStatus(""), 3500);
            }
        }

        function escapeSearchHtml(value) {
            return String(value === null || value === undefined ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const searchPinIcon = L.divIcon({
            className: "ban-search-marker",
            html: "<span aria-hidden=\"true\"></span>",
            iconSize: [26, 34],
            iconAnchor: [13, 34],
            popupAnchor: [0, -30]
        });

        function featureLabel(feature) {
            if (!feature) return "Ubicación sin nombre";
            return feature.text || feature.place_name || "Ubicación sin nombre";
        }

        // MapTiler devuelve bbox = [minX, minY, maxX, maxY] → [oeste, sur, este, norte]
        function featureBounds(feature) {
            const bbox = feature && feature.bbox;
            if (!Array.isArray(bbox) || bbox.length !== 4 || !bbox.every(Number.isFinite)) {
                return null;
            }
            const bounds = L.latLngBounds([bbox[1], bbox[0]], [bbox[3], bbox[2]]);
            return bounds.isValid() ? bounds : null;
        }

        // Único punto que mueve la cámara tras una búsqueda.
        // No toca currentLayer, no llama a enviarGeoJson().
        function selectLocation(feature) {
            if (!feature || !Array.isArray(feature.center) || feature.center.length < 2) {
                setSearchStatus("El resultado no tiene coordenadas válidas.", "error");
                return false;
            }

            const lng = Number(feature.center[0]);
            const lat = Number(feature.center[1]);

            if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
                Math.abs(lat) > 90 || Math.abs(lng) > 180) {
                setSearchStatus("El resultado no tiene coordenadas válidas.", "error");
                return false;
            }

            const center = L.latLng(lat, lng);
            searchLayer.clearLayers();

            const marker = L.marker(center, {
                icon: searchPinIcon,
                keyboard: false,
                pmIgnore: true,          // Geoman no lo edita ni lo elimina
                zIndexOffset: 1000,
                riseOnHover: true
            }).addTo(searchLayer);

            const detail = feature.place_name && feature.place_name !== feature.text
                ? "<div class=\"ban-search-detail\">" + escapeSearchHtml(feature.place_name) + "</div>"
                : "";

            marker.bindPopup(
                "<div class=\"ban-search-popup\">" +
                "<strong>" + escapeSearchHtml(featureLabel(feature)) + "</strong>" +
                detail +
                "<div class=\"ban-search-coords\">" +
                lat.toFixed(6) + ", " + lng.toFixed(6) +
                "</div></div>",
                { autoPan: true, closeButton: true, maxWidth: 320 }
            );
            marker.openPopup();

            const bounds = featureBounds(feature);
            const isSinglePoint = !bounds ||
                (Math.abs(bounds.getNorth() - bounds.getSouth()) < 1e-9 &&
                 Math.abs(bounds.getEast() - bounds.getWest()) < 1e-9);

            if (isSinglePoint) {
                map.setView(center, Math.max(map.getZoom(), 16), { animate: false });
            } else {
                map.fitBounds(bounds, {
                    padding: SEARCH_CONFIG.fitPadding,
                    maxZoom: SEARCH_CONFIG.maxZoom,
                    animate: false
                });
            }

            setSearchStatus("Ubicación: " + featureLabel(feature), "ok");
            console.info("[Creatio GeoJSON] Ubicación seleccionada", {
                text: feature.text,
                placeName: feature.place_name,
                placeType: feature.place_type,
                center: { lat, lng },
                geoJsonAffected: false
            });

            // Puente opcional para un campo de búsqueda en la página Freedom UI.
            postToCreatio({
                type: "location_search_result",
                action: "search",
                found: true,
                name: featureLabel(feature),
                latitude: lat,
                longitude: lng
            });

            return true;
        }

        function initLocationSearch() {
            const api = window.maptilerGeocoder;

            if (!api || typeof api.GeocodingControl !== "function") {
                console.warn(
                    "[Creatio GeoJSON] MapTiler Geocoding Control no está disponible; " +
                    "el mapa continúa sin buscador."
                );
                return null;
            }

            if (!SEARCH_CONFIG.apiKey) {
                console.warn("[Creatio GeoJSON] Define MAPTILER_API_KEY para habilitar la búsqueda.");
                setSearchStatus("Configura la clave de MapTiler para habilitar la búsqueda.", "error");
                return null;
            }

            geocodingControl = new api.GeocodingControl({
                apiKey: SEARCH_CONFIG.apiKey,
                position: SEARCH_CONFIG.position,
                placeholder: "Buscar dirección, lugar o punto de interés…",
                language: SEARCH_CONFIG.language,
                country: SEARCH_CONFIG.country || undefined,
                types: SEARCH_CONFIG.types || undefined,
                limit: SEARCH_CONFIG.limit,
                minLength: SEARCH_CONFIG.minLength,
                debounceSearch: SEARCH_CONFIG.debounceSearch,

                /* --- Autocompletado --- */
                showResultsWhileTyping: true,   // envía autocomplete=true a la API
                selectFirst: true,              // Enter acepta la primera sugerencia
                clearListOnPick: true,
                showPlaceType: "if-needed",
                proximity: SEARCH_CONFIG.biasToMapCenter
                    ? [{ type: "map-center" }]
                    : null,

                /* --- Cámara y pin bajo nuestro control --- */
                marker: false,
                showResultMarkers: false,
                markerOnSelected: false,
                flyTo: false,
                flyToSelected: false,
                flyToFeatures: "never",
                fullGeometryStyle: false,
                pickedResultStyle: "marker-only",

                /* --- Mensajes en español --- */
                noResultsMessage:
                    "Sin resultados. Prueba con otra dirección o un punto de referencia.",
                errorMessage: "No se pudo consultar el servicio de búsqueda."
            });

            // `pick` = el usuario eligió una sugerencia.
            // (`select` se dispara al resaltar una fila; no debe mover el mapa.)
            geocodingControl.on("pick", event => {
                if (!event || !event.feature) return;
                selectLocation(event.feature);
            });

            geocodingControl.on("featureslisted", event => {
                if (!DEBUG) return;
                console.debug(
                    "[Creatio GeoJSON] Sugerencias recibidas:",
                    (event && event.features ? event.features.length : 0)
                );
            });

            map.addControl(geocodingControl);

            // Evita que el teclado del buscador active atajos del mapa o de Geoman
            // (p. ej. Enter no debe finalizar un polígono en dibujo).
            const container = typeof geocodingControl.getContainer === "function"
                ? geocodingControl.getContainer()
                : null;

            if (container) {
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);
                ["keydown", "keyup", "keypress"].forEach(type => {
                    container.addEventListener(type, event => event.stopPropagation());
                });
            }

            console.info("[Creatio GeoJSON] Búsqueda con autocompletado lista", {
                provider: "MapTiler Geocoding",
                autocomplete: true,
                country: SEARCH_CONFIG.country || "(mundial)",
                geoJsonAffected: false
            });

            return geocodingControl;
        }

        // Puente opcional: buscar desde un input de la página Freedom UI.
        // El usuario elige de la lista del mapa; el resultado se reporta en selectLocation().
        function searchFromParent(query, requestId) {
            if (!geocodingControl) {
                postToCreatio({
                    type: "location_search_result",
                    action: "search",
                    requestId: requestId || null,
                    found: false,
                    message: "El buscador no está disponible."
                });
                return;
            }

            const value = String(query || "").trim();
            if (value.length < SEARCH_CONFIG.minLength) {
                postToCreatio({
                    type: "location_search_result",
                    action: "search",
                    requestId: requestId || null,
                    found: false,
                    message: "Escribe al menos " + SEARCH_CONFIG.minLength + " caracteres."
                });
                return;
            }

            geocodingControl.focus();
            geocodingControl.setQuery(value);
            geocodingControl.submitQuery(value);
        }

        function isObject(value) {
            return value !== null && typeof value === "object" && !Array.isArray(value);
        }

        function cloneJson(value) {
            return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
        }

        function isPosition(position) {
            return Array.isArray(position) &&
                position.length >= 2 &&
                Number.isFinite(position[0]) &&
                Number.isFinite(position[1]) &&
                position[0] >= -180 && position[0] <= 180 &&
                position[1] >= -90 && position[1] <= 90 &&
                position.slice(2).every(Number.isFinite);
        }

        function samePosition(first, last) {
            return Array.isArray(first) && Array.isArray(last) &&
                first.length >= 2 && last.length >= 2 &&
                Math.abs(first[0] - last[0]) <= 1e-10 &&
                Math.abs(first[1] - last[1]) <= 1e-10;
        }

        function validateLineString(coordinates, minPositions) {
            return Array.isArray(coordinates) &&
                coordinates.length >= minPositions &&
                coordinates.every(isPosition);
        }

        function validateLinearRing(ring) {
            if (!validateLineString(ring, 4) || !samePosition(ring[0], ring[ring.length - 1])) {
                return false;
            }

            const uniquePositions = new Set(
                ring.slice(0, -1).map(position => `${position[0]},${position[1]}`)
            );
            return uniquePositions.size >= 3;
        }

        function geometryValidationError(geometry, path) {
            if (!isObject(geometry) || typeof geometry.type !== "string") {
                return `${path} no es una geometría GeoJSON válida.`;
            }

            const coordinates = geometry.coordinates;
            switch (geometry.type) {
                case "Point":
                    return isPosition(coordinates) ? null : `${path}.coordinates no es una posición [longitud, latitud] válida.`;

                case "MultiPoint":
                    return Array.isArray(coordinates) && coordinates.length > 0 && coordinates.every(isPosition)
                        ? null
                        : `${path}.coordinates no contiene posiciones válidas.`;

                case "LineString":
                    return validateLineString(coordinates, 2)
                        ? null
                        : `${path}.coordinates debe contener al menos dos posiciones válidas.`;

                case "MultiLineString":
                    return Array.isArray(coordinates) && coordinates.length > 0 &&
                        coordinates.every(line => validateLineString(line, 2))
                        ? null
                        : `${path}.coordinates contiene una línea inválida.`;

                case "Polygon":
                    return Array.isArray(coordinates) && coordinates.length > 0 &&
                        coordinates.every(validateLinearRing)
                        ? null
                        : `${path}.coordinates debe contener anillos cerrados con al menos tres vértices distintos.`;

                case "MultiPolygon":
                    return Array.isArray(coordinates) && coordinates.length > 0 &&
                        coordinates.every(polygon => Array.isArray(polygon) && polygon.length > 0 && polygon.every(validateLinearRing))
                        ? null
                        : `${path}.coordinates contiene un polígono o anillo inválido.`;

                case "GeometryCollection":
                    if (!Array.isArray(geometry.geometries)) {
                        return `${path}.geometries debe ser un arreglo.`;
                    }
                    for (let index = 0; index < geometry.geometries.length; index++) {
                        const error = geometryValidationError(geometry.geometries[index], `${path}.geometries[${index}]`);
                        if (error) return error;
                    }
                    return null;

                default:
                    return `${path}.type no está soportado: ${geometry.type}.`;
            }
        }

        function featureValidationError(feature, path) {
            if (!isObject(feature) || feature.type !== "Feature") {
                return `${path} debe tener type="Feature".`;
            }

            if (feature.properties !== undefined && feature.properties !== null && !isObject(feature.properties)) {
                return `${path}.properties debe ser un objeto o null.`;
            }

            // GeoJSON permite geometry:null. No se dibuja, pero tampoco se envía a Leaflet.
            if (feature.geometry === null) return null;

            const error = geometryValidationError(feature.geometry, `${path}.geometry`);
            if (error) return error;

            const properties = feature.properties || {};
            if (
                feature.geometry.type === "Point" &&
                String(properties.zoneType || "").toUpperCase() === "CIRCLE"
            ) {
                const radius = Number(properties.radiusMeters);
                if (!Number.isFinite(radius) || radius <= 0) {
                    return `${path}.properties.radiusMeters debe ser un número mayor que cero para un círculo.`;
                }
            }

            return null;
        }

        function geoJsonValidationError(geojson) {
            if (!isObject(geojson) || typeof geojson.type !== "string") {
                return "El valor raíz no es un objeto GeoJSON con propiedad type.";
            }

            if (geojson.type === "Feature") {
                return featureValidationError(geojson, "GeoJSON");
            }

            if (geojson.type === "FeatureCollection") {
                if (!Array.isArray(geojson.features)) {
                    return "GeoJSON.features debe ser un arreglo.";
                }
                for (let index = 0; index < geojson.features.length; index++) {
                    const error = featureValidationError(geojson.features[index], `GeoJSON.features[${index}]`);
                    if (error) return error;
                }
                return null;
            }

            return geometryValidationError(geojson, "GeoJSON");
        }

        function parseCreatioGeoJson(rawValue) {
            let value = rawValue;

            // Creatio puede entregar el campo como JSON serializado o dentro de un wrapper.
            for (let attempt = 0; attempt < 4; attempt++) {
                if (value === null || value === undefined) {
                    return { empty: true, value: null };
                }

                if (typeof value === "string") {
                    const trimmed = value.trim();
                    if (!trimmed) return { empty: true, value: null };
                    try {
                        value = JSON.parse(trimmed);
                        continue;
                    } catch (error) {
                        return { error: `JSON.parse falló: ${error.message}`, value: null };
                    }
                }

                if (isObject(value) && Object.prototype.hasOwnProperty.call(value, "__zone_symbol__value")) {
                    value = value.__zone_symbol__value;
                    continue;
                }

                return { empty: false, value };
            }

            if (typeof value === "string") {
                return { error: "El valor sigue siendo una cadena después de varios intentos de parseo.", value: null };
            }

            return { empty: value === null || value === undefined, value };
        }

        function getFeatures(geojson) {
            if (geojson.type === "FeatureCollection") return geojson.features;
            if (geojson.type === "Feature") return [geojson];
            return [{ type: "Feature", geometry: geojson, properties: {} }];
        }

        function createLeafletLayers(feature) {
            if (!feature.geometry) return [];

            const properties = feature.properties || {};
            const isCircle = feature.geometry.type === "Point" &&
                String(properties.zoneType || "").toUpperCase() === "CIRCLE";

            if (isCircle) {
                const coordinates = feature.geometry.coordinates;
                const circle = L.circle(
                    [coordinates[1], coordinates[0]],
                    { radius: Number(properties.radiusMeters) }
                );
                circle._creatioFeature = cloneJson(feature);
                return [circle];
            }

            const geoJsonLayer = L.geoJSON(feature);
            const layers = [];
            geoJsonLayer.eachLayer(layer => layers.push(layer));
            return layers;
        }

        function collectLeafLayers(layer, result) {
            if (!layer) return;
            if (typeof layer.eachLayer === "function") {
                layer.eachLayer(child => collectLeafLayers(child, result));
            } else {
                result.push(layer);
            }
        }

        function serializeLayer(layer) {
            if (layer instanceof L.Circle) {
                const original = layer._creatioFeature || {};
                const originalProperties = isObject(original.properties) ? original.properties : {};
                const latLng = layer.getLatLng();
                return {
                    type: "Feature",
                    ...(original.id !== undefined ? { id: original.id } : {}),
                    geometry: {
                        type: "Point",
                        coordinates: [latLng.lng, latLng.lat]
                    },
                    properties: {
                        ...originalProperties,
                        zoneType: "CIRCLE",
                        radiusMeters: layer.getRadius()
                    }
                };
            }

            const result = layer.toGeoJSON();
            if (result.type === "FeatureCollection") return result.features;
            if (result.type === "Feature") {
                if (layer.feature && layer.feature.id !== undefined && result.id === undefined) {
                    result.id = layer.feature.id;
                }
                return result;
            }
            return { type: "Feature", geometry: result, properties: {} };
        }

        function serializeCurrentGeoJson() {
            const layers = [];
            collectLeafLayers(currentLayer, layers);

            const features = [];
            layers.forEach(layer => {
                const serialized = serializeLayer(layer);
                if (Array.isArray(serialized)) features.push(...serialized);
                else features.push(serialized);
            });

            if (currentWasFeatureCollection || features.length > 1) {
                return { type: "FeatureCollection", features };
            }
            return features[0] || null;
        }

        function postToCreatio(message) {
            if (DEBUG) console.log("[Creatio GeoJSON] Enviando postMessage", message);
            window.parent.postMessage(message, CREATIO_ORIGIN);
        }

        function messageTypeForGeoJson(geojson) {
            const features = getFeatures(geojson);
            if (features.length === 1) {
                const feature = features[0];
                if (
                    feature.geometry &&
                    feature.geometry.type === "Point" &&
                    String((feature.properties || {}).zoneType || "").toUpperCase() === "CIRCLE"
                ) {
                    return "circle_created";
                }
            }
            // Se conserva el nombre usado por la integración existente para polygon/rectangle.
            return "polygon_created";
        }

        function geometryTypeForGeoJson(geojson) {
            const features = getFeatures(geojson);
            if (features.length !== 1 || !features[0].geometry) return "MULTIPLE";

            const feature = features[0];
            const zoneType = String((feature.properties || {}).zoneType || "").toUpperCase();

            if (feature.geometry.type === "Polygon") return "POLYGON";
            if (feature.geometry.type === "Point") return zoneType === "CIRCLE" ? "CIRCLE" : "POINT";
            return feature.geometry.type.toUpperCase();
        }

        function enviarGeoJson() {
            const geojson = serializeCurrentGeoJson();
            if (!geojson) {
                console.warn("[Creatio GeoJSON] No hay geometría que guardar.");
                return;
            }

            const serialized = JSON.stringify(geojson);
            console.log("[Creatio GeoJSON] Geometría lista para BANCoordenadas", geojson);

            postToCreatio({
                type: messageTypeForGeoJson(geojson),
                action: "save",
                fieldName: GEOJSON_FIELD,
                geojson: serialized,
                geometryType: geometryTypeForGeoJson(geojson)
            });
        }

        function clearCurrentLayer() {
            if (!currentLayer) {
                currentWasFeatureCollection = false;
                return;
            }

            clearingLayers = true;
            const layerToRemove = currentLayer;
            currentLayer = null;
            currentWasFeatureCollection = false;

            try {
                if (map.hasLayer(layerToRemove)) {
                    map.removeLayer(layerToRemove);
                } else if (typeof layerToRemove.eachLayer === "function") {
                    layerToRemove.eachLayer(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                }
            } finally {
                clearingLayers = false;
            }
        }

        function notifyCreatioToClear() {
            postToCreatio({
                type: "geojson_cleared",
                action: "clear",
                fieldName: GEOJSON_FIELD,
                geojson: null
            });
        }

        function resetMapView() {
            map.invalidateSize({ pan: false, animate: false });
            map.setView(PANAMA, 8, { animate: false });
            addBasemap();
        }

        function renderGeoJson(geojson) {
            const features = getFeatures(geojson);
            const nextLayers = [];

            try {
                features.forEach(feature => {
                    nextLayers.push(...createLeafletLayers(feature));
                });
            } catch (error) {
                console.warn("[Creatio GeoJSON] No se pudo preparar la geometría; el mapa no se modificó.", error, geojson);
                return false;
            }

            clearCurrentLayer();
            currentWasFeatureCollection = geojson.type === "FeatureCollection";

            if (nextLayers.length === 0) {
                console.warn("[Creatio GeoJSON] GeoJSON válido, pero no contiene geometrías dibujables.");
                resetMapView();
                return true;
            }

            currentLayer = L.featureGroup(nextLayers).addTo(map);
            attachLayerListeners(currentLayer);

            const bounds = currentLayer.getBounds();
            console.log("[Creatio GeoJSON] Geometría cargada; bounds:", bounds);
            map.invalidateSize({ pan: false, animate: false });
            if (bounds.isValid()) {
                map.fitBounds(bounds, {
                    animate: false,
                    padding: [24, 24],
                    maxZoom: 18
                });
            }
            addBasemap();
            return true;
        }

        function getMessageGeoJson(message) {
            if (Object.prototype.hasOwnProperty.call(message, "geojson")) return message.geojson;
            if (Object.prototype.hasOwnProperty.call(message, GEOJSON_FIELD)) return message[GEOJSON_FIELD];
            if (Object.prototype.hasOwnProperty.call(message, "value")) return message.value;
            return undefined;
        }

        function isSupportedLoadMessage(message) {
            return isObject(message) &&
                ["load_polygon", "load_geojson", "load_geometry", "set_geojson"].includes(message.type);
        }

        window.addEventListener("message", event => {
            if (event.source !== window.parent) {
                console.warn("[Creatio GeoJSON] Se ignoró un mensaje que no proviene del contenedor padre.");
                return;
            }

            if (CREATIO_ORIGIN !== "*" && event.origin !== CREATIO_ORIGIN) {
                console.warn("[Creatio GeoJSON] Se ignoró un mensaje de origen no permitido:", event.origin);
                return;
            }

            if (!isSupportedLoadMessage(event.data)) return;

            const rawValue = getMessageGeoJson(event.data);
            console.debug("[Creatio GeoJSON] Mensaje recibido desde Creatio", {
                messageType: event.data.type,
                fieldName: event.data.fieldName || GEOJSON_FIELD,
                valueType: typeof rawValue,
                value: rawValue
            });

            const parsed = parseCreatioGeoJson(rawValue);
            if (parsed.empty) {
                console.info("[Creatio GeoJSON] Campo BANCoordenadas vacío; se muestra el mapa sin geometría.");
                initialDataReceived = true;
                if (initialRequestTimer) {
                    clearInterval(initialRequestTimer);
                    initialRequestTimer = null;
                }
                clearCurrentLayer();
                resetMapView();
                return;
            }

            if (parsed.error) {
                console.warn("[Creatio GeoJSON] Valor recibido no válido; no se envió a Leaflet:", parsed.error, rawValue);
                return;
            }

            const validationError = geoJsonValidationError(parsed.value);
            if (validationError) {
                console.warn("[Creatio GeoJSON] GeoJSON inválido; no se envió a L.geoJSON():", validationError, parsed.value);
                return;
            }

            initialDataReceived = true;
            if (initialRequestTimer) {
                clearInterval(initialRequestTimer);
                initialRequestTimer = null;
            }
            console.debug("[Creatio GeoJSON] GeoJSON validado; coordenadas de entrada [longitud, latitud].", parsed.value);
            renderGeoJson(parsed.value);
        });

        // Puente opcional: búsqueda solicitada desde un input de la página Freedom UI.
        // No interfiere con el listener de load_polygon/load_geojson.
        window.addEventListener("message", event => {
            if (event.source !== window.parent) return;
            if (!isObject(event.data) || event.data.type !== "search_location") return;
            if (CREATIO_ORIGIN !== "*" && event.origin !== CREATIO_ORIGIN) return;

            searchFromParent(event.data.query, event.data.requestId);
        });

        function attachLayerListeners(layerOrGroup) {
            const layers = [];
            collectLeafLayers(layerOrGroup, layers);

            layers.forEach(layer => {
                if (layer.pm) layer.pm.enable();
                layer.on("pm:edit", enviarGeoJson);
                layer.on("pm:dragend", enviarGeoJson);
            });
        }

        function containsLayer(container, target) {
            if (!container || !target) return false;
            if (container === target) return true;

            if (typeof container.eachLayer === "function") {
                let found = false;
                container.eachLayer(child => {
                    if (!found && containsLayer(child, target)) found = true;
                });
                return found;
            }
            return false;
        }

        // Una nueva geometría reemplaza la anterior, como en la implementación actual.
        map.on("pm:create", event => {
            const layer = event.layer;
            clearCurrentLayer();
            currentWasFeatureCollection = false;
            currentLayer = layer;

            if (!map.hasLayer(layer)) layer.addTo(map);
            attachLayerListeners(layer);
            enviarGeoJson();
        });

        // Al borrar una geometría administrada se limpia BANCoordenadas en Creatio.
        map.on("pm:remove", event => {
            if (clearingLayers || !currentLayer || !containsLayer(currentLayer, event.layer)) return;

            console.info("[Creatio GeoJSON] Geometría eliminada desde Geoman; se limpiará BANCoordenadas.");
            clearCurrentLayer();
            notifyCreatioToClear();
            resetMapView();
        });

        // Solicita el GeoJSON enseguida y reintenta brevemente por si Creatio
        // todavía no había conectado su listener al cargar el iframe.
        function requestInitialGeoJson() {
            if (initialDataReceived) {
                if (initialRequestTimer) {
                    clearInterval(initialRequestTimer);
                    initialRequestTimer = null;
                }
                return;
            }

            if (initialRequestAttempts >= 8) {
                console.warn("[Creatio GeoJSON] Creatio no respondió a la solicitud inicial; se muestra Panamá como vista por defecto.");
                finishInitialLoadWithoutGeometry();
                return;
            }

            initialRequestAttempts++;
            postToCreatio({
                type: "get_polygon",
                fieldName: GEOJSON_FIELD
            });
        }

        try {
            initLocationSearch();
        } catch (error) {
            console.warn("[Creatio GeoJSON] La búsqueda no se pudo inicializar:", error);
        }

        if (isEmbedded()) {
            requestInitialGeoJson();
            initialRequestTimer = setInterval(requestInitialGeoJson, 400);
        } else {
            console.info("[Creatio GeoJSON] Vista previa sin contenedor Creatio: no se solicita geometría guardada.");
            addBasemap();
        }
    </script>
</body>
</html>
