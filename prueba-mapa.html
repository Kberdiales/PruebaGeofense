<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofence Map - Panamá</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>

    <script>
        // Mostrar Panamá al iniciar.
        const PANAMA = [8.9824, -79.5199];
        const map = L.map('map').setView(PANAMA, 8);
        let currentLayer = null;

        console.log("Centro inicial:", map.getCenter());

        // Capa base de OpenStreetMap HOT.
        L.tileLayer(
            'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 20
            }
        ).addTo(map);

        // Corrige el tamaño del mapa cuando la página ya está visible.
        window.addEventListener("load", () => {
            setTimeout(() => {
                map.invalidateSize();
                map.setView(PANAMA, 8);
                console.log("Mapa reajustado", map.getSize());
            }, 1500);
        });

        // Herramientas para dibujar y editar geometrías.
        map.pm.addControls({
            position: 'topleft',
            drawPolygon: true,
            drawRectangle: true,
            drawMarker: false,
            drawCircle: true,
            drawCircleMarker: false,
            drawPolyline: false,
            editMode: true,
            dragMode: true,
            removalMode: true
        });

        // Envía GeoJSON a Creatio. Los círculos se representan como Point + radiusMeters.
        function enviarGeoJson(layer) {
            const esCirculo = layer instanceof L.Circle;
            const feature = esCirculo
                ? {
                    type: "Feature",
                    geometry: {
                        type: "Point",
                        coordinates: [
                            layer.getLatLng().lng,
                            layer.getLatLng().lat
                        ]
                    },
                    properties: {
                        zoneType: "CIRCLE",
                        radiusMeters: layer.getRadius()
                    }
                }
                : layer.toGeoJSON();

            const geojson = JSON.stringify(feature);
            console.log("GeoJSON:", geojson);

            window.parent.postMessage({
                type: esCirculo ? "circle_created" : "polygon_created",
                geojson: geojson
            }, "*");
        }

        window.addEventListener("message", function(event) {
            if (!event.data || event.data.type !== "load_polygon") {
                return;
            }

            if (!event.data.geojson || event.data.geojson === "") {
                console.log("Registro nuevo. No existe geocerca.");
                map.invalidateSize();
                map.setView(PANAMA, 8);
                return;
            }

            try {
                let geojson = event.data.geojson;
                console.log("GeoJSON recibido:", geojson);

                // Compatibilidad con el wrapper que puede entregar Creatio.
                if (
                    geojson &&
                    typeof geojson === "object" &&
                    geojson.__zone_symbol__value
                ) {
                    geojson = geojson.__zone_symbol__value;
                }

                // Convierte una cadena JSON a objeto.
                if (typeof geojson === "string") {
                    geojson = JSON.parse(geojson);
                }

                // Elimina la geometría actual antes de cargar otra.
                if (currentLayer) {
                    map.removeLayer(currentLayer);
                }

                // Los círculos GeoJSON son Point con zoneType y radiusMeters.
                const feature = geojson.type === "Feature" ? geojson : null;
                const geometry = feature ? feature.geometry : geojson;
                const properties = feature ? feature.properties : {};

                if (
                    geometry &&
                    geometry.type === "Point" &&
                    properties &&
                    properties.zoneType === "CIRCLE" &&
                    Number(properties.radiusMeters) > 0
                ) {
                    const coordinates = geometry.coordinates;
                    const circle = L.circle(
                        [coordinates[1], coordinates[0]],
                        { radius: Number(properties.radiusMeters) }
                    );
                    currentLayer = L.featureGroup([circle]).addTo(map);
                } else {
                    currentLayer = L.geoJSON(geojson).addTo(map);
                }

                const bounds = currentLayer.getBounds();
                console.log("Bounds:", bounds);

                if (bounds.isValid()) {
                    map.fitBounds(bounds);
                }

                currentLayer.eachLayer(function(layer) {
                    if (layer.pm) {
                        layer.pm.enable();
                    }

                    layer.on('pm:edit', function() {
                        enviarGeoJson(layer);
                    });
                });

                console.log("Geometría cargada");
            } catch (ex) {
                console.error("Error cargando geometría", ex);
            }
        });

        // Reemplaza la geometría existente al dibujar una nueva.
        map.on('pm:create', function(e) {
            const layer = e.layer;

            if (currentLayer) {
                map.removeLayer(currentLayer);
            }

            currentLayer = layer;

            if (layer.pm) {
                layer.pm.enable();
            }

            enviarGeoJson(layer);

            layer.on('pm:edit', function() {
                enviarGeoJson(layer);
            });
        });

        // Solicita la geometría existente al contenedor Creatio.
        setTimeout(() => {
            window.parent.postMessage({ type: "get_polygon" }, "*");
        }, 2000);
    </script>
</body>
</html>
