<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leaflet + Geoman</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css"/>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>

<script>

    const map = L.map('map').setView([8.9824, -79.5199], 12);

    // Tu proveedor que ya funciona
    L.tileLayer(
        'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 20
        }
    ).addTo(map);

    // Toolbar Geoman
    map.pm.addControls({
        position: 'topleft',
        drawPolygon: true,
        drawRectangle: true,
        drawMarker: false,
        drawCircle: false,
        drawCircleMarker: false,
        drawPolyline: false,
        editMode: true,
        dragMode: true,
        removalMode: true
    });

    // Cuando se crea un polígono
    map.on('pm:create', function(e) {

        const layer = e.layer;

        const geojson = layer.toGeoJSON();

        console.log('Polígono creado');
        console.log(JSON.stringify(geojson, null, 2));

        alert('Polígono creado');
    });

</script>

</body>
</html>
