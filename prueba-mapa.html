<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofence Map - Panamá</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>

    <script>
        // Centro inicial del mapa: Leaflet recibe [latitud, longitud].
        const PANAMA = [8.9824, -79.5199];
        const GEOJSON_FIELD = "BANCoordenadas";
        const map = L.map("map").setView(PANAMA, 8);

        let currentLayer = null;
        let currentWasFeatureCollection = false;
        let clearingLayers = false;

        // Usa el origen del contenedor cuando el navegador informa el referrer.
        // Para producción, se recomienda configurar un origen fijo de Creatio.
        const CREATIO_ORIGIN = (() => {
            try {
                const origin = new URL(document.referrer).origin;
                return origin && origin !== "null" ? origin : "*";
            } catch (_) {
                return "*";
            }
        })();

        console.log("[Creatio GeoJSON] Mapa inicializado", {
            center: map.getCenter(),
            fieldName: GEOJSON_FIELD,
            parentOrigin: CREATIO_ORIGIN
        });

        L.tileLayer(
            "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors",
                maxZoom: 20
            }
        ).addTo(map);

        window.addEventListener("load", () => {
            setTimeout(() => {
                map.invalidateSize();
                if (!currentLayer) {
                    map.setView(PANAMA, 8);
                }
                console.log("[Creatio GeoJSON] Mapa reajustado", map.getSize());
            }, 1500);
        });

        // Conserva Polygon, Rectangle y Circle del HTML de GitHub y habilita Point.
        map.pm.addControls({
            position: "topleft",
            drawPolygon: true,
            drawRectangle: true,
            drawMarker: false,
            drawCircle: true,
            drawCircleMarker: false,
            drawPolyline: false,
            editMode: true,
            dragMode: true,
            removalMode: true
        });

        function isObject(value) {
            return value !== null && typeof value === "object" && !Array.isArray(value);
        }

        function cloneJson(value) {
            return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
        }

        function isPosition(position) {
            return Array.isArray(position) &&
                position.length >= 2 &&
                Number.isFinite(position[0]) &&
                Number.isFinite(position[1]) &&
                position[0] >= -180 && position[0] <= 180 &&
                position[1] >= -90 && position[1] <= 90 &&
                position.slice(2).every(Number.isFinite);
        }

        function samePosition(first, last) {
            return Array.isArray(first) && Array.isArray(last) &&
                first.length >= 2 && last.length >= 2 &&
                Math.abs(first[0] - last[0]) <= 1e-10 &&
                Math.abs(first[1] - last[1]) <= 1e-10;
        }

        function validateLineString(coordinates, minPositions) {
            return Array.isArray(coordinates) &&
                coordinates.length >= minPositions &&
                coordinates.every(isPosition);
        }

        function validateLinearRing(ring) {
            if (!validateLineString(ring, 4) || !samePosition(ring[0], ring[ring.length - 1])) {
                return false;
            }

            const uniquePositions = new Set(
                ring.slice(0, -1).map(position => `${position[0]},${position[1]}`)
            );
            return uniquePositions.size >= 3;
        }

        function geometryValidationError(geometry, path) {
            if (!isObject(geometry) || typeof geometry.type !== "string") {
                return `${path} no es una geometría GeoJSON válida.`;
            }

            const coordinates = geometry.coordinates;
            switch (geometry.type) {
                case "Point":
                    return isPosition(coordinates) ? null : `${path}.coordinates no es una posición [longitud, latitud] válida.`;

                case "MultiPoint":
                    return Array.isArray(coordinates) && coordinates.length > 0 && coordinates.every(isPosition)
                        ? null
                        : `${path}.coordinates no contiene posiciones válidas.`;

                case "LineString":
                    return validateLineString(coordinates, 2)
                        ? null
                        : `${path}.coordinates debe contener al menos dos posiciones válidas.`;

                case "MultiLineString":
                    return Array.isArray(coordinates) && coordinates.length > 0 &&
                        coordinates.every(line => validateLineString(line, 2))
                        ? null
                        : `${path}.coordinates contiene una línea inválida.`;

                case "Polygon":
                    return Array.isArray(coordinates) && coordinates.length > 0 &&
                        coordinates.every(validateLinearRing)
                        ? null
                        : `${path}.coordinates debe contener anillos cerrados con al menos tres vértices distintos.`;

                case "MultiPolygon":
                    return Array.isArray(coordinates) && coordinates.length > 0 &&
                        coordinates.every(polygon => Array.isArray(polygon) && polygon.length > 0 && polygon.every(validateLinearRing))
                        ? null
                        : `${path}.coordinates contiene un polígono o anillo inválido.`;

                case "GeometryCollection":
                    if (!Array.isArray(geometry.geometries)) {
                        return `${path}.geometries debe ser un arreglo.`;
                    }
                    for (let index = 0; index < geometry.geometries.length; index++) {
                        const error = geometryValidationError(geometry.geometries[index], `${path}.geometries[${index}]`);
                        if (error) return error;
                    }
                    return null;

                default:
                    return `${path}.type no está soportado: ${geometry.type}.`;
            }
        }

        function featureValidationError(feature, path) {
            if (!isObject(feature) || feature.type !== "Feature") {
                return `${path} debe tener type="Feature".`;
            }

            if (feature.properties !== undefined && feature.properties !== null && !isObject(feature.properties)) {
                return `${path}.properties debe ser un objeto o null.`;
            }

            // GeoJSON permite geometry:null. No se dibuja, pero tampoco se envía a Leaflet.
            if (feature.geometry === null) return null;

            const error = geometryValidationError(feature.geometry, `${path}.geometry`);
            if (error) return error;

            const properties = feature.properties || {};
            if (
                feature.geometry.type === "Point" &&
                String(properties.zoneType || "").toUpperCase() === "CIRCLE"
            ) {
                const radius = Number(properties.radiusMeters);
                if (!Number.isFinite(radius) || radius <= 0) {
                    return `${path}.properties.radiusMeters debe ser un número mayor que cero para un círculo.`;
                }
            }

            return null;
        }

        function geoJsonValidationError(geojson) {
            if (!isObject(geojson) || typeof geojson.type !== "string") {
                return "El valor raíz no es un objeto GeoJSON con propiedad type.";
            }

            if (geojson.type === "Feature") {
                return featureValidationError(geojson, "GeoJSON");
            }

            if (geojson.type === "FeatureCollection") {
                if (!Array.isArray(geojson.features)) {
                    return "GeoJSON.features debe ser un arreglo.";
                }
                for (let index = 0; index < geojson.features.length; index++) {
                    const error = featureValidationError(geojson.features[index], `GeoJSON.features[${index}]`);
                    if (error) return error;
                }
                return null;
            }

            return geometryValidationError(geojson, "GeoJSON");
        }

        function parseCreatioGeoJson(rawValue) {
            let value = rawValue;

            // Creatio puede entregar el campo como JSON serializado o dentro de un wrapper.
            for (let attempt = 0; attempt < 4; attempt++) {
                if (value === null || value === undefined) {
                    return { empty: true, value: null };
                }

                if (typeof value === "string") {
                    const trimmed = value.trim();
                    if (!trimmed) return { empty: true, value: null };
                    try {
                        value = JSON.parse(trimmed);
                        continue;
                    } catch (error) {
                        return { error: `JSON.parse falló: ${error.message}`, value: null };
                    }
                }

                if (isObject(value) && Object.prototype.hasOwnProperty.call(value, "__zone_symbol__value")) {
                    value = value.__zone_symbol__value;
                    continue;
                }

                return { empty: false, value };
            }

            if (typeof value === "string") {
                return { error: "El valor sigue siendo una cadena después de varios intentos de parseo.", value: null };
            }

            return { empty: value === null || value === undefined, value };
        }

        function getFeatures(geojson) {
            if (geojson.type === "FeatureCollection") return geojson.features;
            if (geojson.type === "Feature") return [geojson];
            return [{ type: "Feature", geometry: geojson, properties: {} }];
        }

        function createLeafletLayers(feature) {
            if (!feature.geometry) return [];

            const properties = feature.properties || {};
            const isCircle = feature.geometry.type === "Point" &&
                String(properties.zoneType || "").toUpperCase() === "CIRCLE";

            if (isCircle) {
                const coordinates = feature.geometry.coordinates;
                const circle = L.circle(
                    [coordinates[1], coordinates[0]],
                    { radius: Number(properties.radiusMeters) }
                );
                circle._creatioFeature = cloneJson(feature);
                return [circle];
            }

            const geoJsonLayer = L.geoJSON(feature);
            const layers = [];
            geoJsonLayer.eachLayer(layer => layers.push(layer));
            return layers;
        }

        function collectLeafLayers(layer, result) {
            if (!layer) return;
            if (typeof layer.eachLayer === "function") {
                layer.eachLayer(child => collectLeafLayers(child, result));
            } else {
                result.push(layer);
            }
        }

        function serializeLayer(layer) {
            if (layer instanceof L.Circle) {
                const original = layer._creatioFeature || {};
                const originalProperties = isObject(original.properties) ? original.properties : {};
                const latLng = layer.getLatLng();
                return {
                    type: "Feature",
                    ...(original.id !== undefined ? { id: original.id } : {}),
                    geometry: {
                        type: "Point",
                        coordinates: [latLng.lng, latLng.lat]
                    },
                    properties: {
                        ...originalProperties,
                        zoneType: "CIRCLE",
                        radiusMeters: layer.getRadius()
                    }
                };
            }

            const result = layer.toGeoJSON();
            if (result.type === "FeatureCollection") return result.features;
            if (result.type === "Feature") {
                if (layer.feature && layer.feature.id !== undefined && result.id === undefined) {
                    result.id = layer.feature.id;
                }
                return result;
            }
            return { type: "Feature", geometry: result, properties: {} };
        }

        function serializeCurrentGeoJson() {
            const layers = [];
            collectLeafLayers(currentLayer, layers);

            const features = [];
            layers.forEach(layer => {
                const serialized = serializeLayer(layer);
                if (Array.isArray(serialized)) features.push(...serialized);
                else features.push(serialized);
            });

            if (currentWasFeatureCollection || features.length > 1) {
                return { type: "FeatureCollection", features };
            }
            return features[0] || null;
        }

        function postToCreatio(message) {
            console.log("[Creatio GeoJSON] Enviando postMessage", message);
            window.parent.postMessage(message, CREATIO_ORIGIN);
        }

        function messageTypeForGeoJson(geojson) {
            const features = getFeatures(geojson);
            if (features.length === 1) {
                const feature = features[0];
                if (
                    feature.geometry &&
                    feature.geometry.type === "Point" &&
                    String((feature.properties || {}).zoneType || "").toUpperCase() === "CIRCLE"
                ) {
                    return "circle_created";
                }
            }
            // Se conserva el nombre usado por la integración existente para polygon/rectangle.
            return "polygon_created";
        }

        function geometryTypeForGeoJson(geojson) {
            const features = getFeatures(geojson);
            if (features.length !== 1 || !features[0].geometry) return "MULTIPLE";
        
            const feature = features[0];
            const zoneType = String((feature.properties || {}).zoneType || "").toUpperCase();
        
            if (feature.geometry.type === "Polygon") return "POLYGON";
            if (feature.geometry.type === "Point") return zoneType === "CIRCLE" ? "CIRCLE" : "POINT";
            return feature.geometry.type.toUpperCase();
        }

        function enviarGeoJson() {
            const geojson = serializeCurrentGeoJson();
            if (!geojson) {
                console.warn("[Creatio GeoJSON] No hay geometría que guardar.");
                return;
            }

            const serialized = JSON.stringify(geojson);
            console.log("[Creatio GeoJSON] Geometría lista para BANGeoJson", geojson);

            postToCreatio({
                type: messageTypeForGeoJson(geojson),
                action: "save",
                fieldName: GEOJSON_FIELD,
                geojson: serialized,
                geometryType: geometryTypeForGeoJson(geojson)
            });
        }

        function clearCurrentLayer() {
            if (!currentLayer) {
                currentWasFeatureCollection = false;
                return;
            }

            clearingLayers = true;
            const layerToRemove = currentLayer;
            currentLayer = null;
            currentWasFeatureCollection = false;

            try {
                if (map.hasLayer(layerToRemove)) {
                    map.removeLayer(layerToRemove);
                } else if (typeof layerToRemove.eachLayer === "function") {
                    layerToRemove.eachLayer(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                }
            } finally {
                clearingLayers = false;
            }
        }

        function notifyCreatioToClear() {
            postToCreatio({
                type: "geojson_cleared",
                action: "clear",
                fieldName: GEOJSON_FIELD,
                geojson: null
            });
        }

        function resetMapView() {
            map.invalidateSize();
            map.setView(PANAMA, 8);
        }

        function renderGeoJson(geojson) {
            const features = getFeatures(geojson);
            const nextLayers = [];

            try {
                features.forEach(feature => {
                    nextLayers.push(...createLeafletLayers(feature));
                });
            } catch (error) {
                console.warn("[Creatio GeoJSON] No se pudo preparar la geometría; el mapa no se modificó.", error, geojson);
                return false;
            }

            clearCurrentLayer();
            currentWasFeatureCollection = geojson.type === "FeatureCollection";

            if (nextLayers.length === 0) {
                console.warn("[Creatio GeoJSON] GeoJSON válido, pero no contiene geometrías dibujables.");
                resetMapView();
                return true;
            }

            currentLayer = L.featureGroup(nextLayers).addTo(map);
            attachLayerListeners(currentLayer);

            const bounds = currentLayer.getBounds();
            console.log("[Creatio GeoJSON] Geometría cargada; bounds:", bounds);
            if (bounds.isValid()) map.fitBounds(bounds);
            map.invalidateSize();
            return true;
        }

        function getMessageGeoJson(message) {
            if (Object.prototype.hasOwnProperty.call(message, "geojson")) return message.geojson;
            if (Object.prototype.hasOwnProperty.call(message, GEOJSON_FIELD)) return message[GEOJSON_FIELD];
            if (Object.prototype.hasOwnProperty.call(message, "value")) return message.value;
            return undefined;
        }

        function isSupportedLoadMessage(message) {
            return isObject(message) &&
                ["load_polygon", "load_geojson", "load_geometry", "set_geojson"].includes(message.type);
        }

        window.addEventListener("message", event => {
            if (event.source !== window.parent) {
                console.warn("[Creatio GeoJSON] Se ignoró un mensaje que no proviene del contenedor padre.");
                return;
            }

            if (CREATIO_ORIGIN !== "*" && event.origin !== CREATIO_ORIGIN) {
                console.warn("[Creatio GeoJSON] Se ignoró un mensaje de origen no permitido:", event.origin);
                return;
            }

            if (!isSupportedLoadMessage(event.data)) return;

            const rawValue = getMessageGeoJson(event.data);
            console.debug("[Creatio GeoJSON] Mensaje recibido desde Creatio", {
                messageType: event.data.type,
                fieldName: event.data.fieldName || GEOJSON_FIELD,
                valueType: typeof rawValue,
                value: rawValue
            });

            const parsed = parseCreatioGeoJson(rawValue);
            if (parsed.empty) {
                console.info("[Creatio GeoJSON] Campo BANGeoJson vacío; se muestra el mapa sin geometría.");
                clearCurrentLayer();
                resetMapView();
                return;
            }

            if (parsed.error) {
                console.warn("[Creatio GeoJSON] Valor recibido no válido; no se envió a Leaflet:", parsed.error, rawValue);
                return;
            }

            const validationError = geoJsonValidationError(parsed.value);
            if (validationError) {
                console.warn("[Creatio GeoJSON] GeoJSON inválido; no se envió a L.geoJSON():", validationError, parsed.value);
                return;
            }

            console.debug("[Creatio GeoJSON] GeoJSON validado; coordenadas de entrada [longitud, latitud].", parsed.value);
            renderGeoJson(parsed.value);
        });

        function attachLayerListeners(layerOrGroup) {
            const layers = [];
            collectLeafLayers(layerOrGroup, layers);

            layers.forEach(layer => {
                if (layer.pm) layer.pm.enable();
                layer.on("pm:edit", enviarGeoJson);
                layer.on("pm:dragend", enviarGeoJson);
            });
        }

        function containsLayer(container, target) {
            if (!container || !target) return false;
            if (container === target) return true;

            if (typeof container.eachLayer === "function") {
                let found = false;
                container.eachLayer(child => {
                    if (!found && containsLayer(child, target)) found = true;
                });
                return found;
            }
            return false;
        }

        // Una nueva geometría reemplaza la anterior, como en la implementación actual.
        map.on("pm:create", event => {
            const layer = event.layer;
            clearCurrentLayer();
            currentWasFeatureCollection = false;
            currentLayer = layer;

            if (!map.hasLayer(layer)) layer.addTo(map);
            attachLayerListeners(layer);
            enviarGeoJson();
        });

        // Al borrar una geometría administrada se limpia BANGeoJson en Creatio.
        map.on("pm:remove", event => {
            if (clearingLayers || !currentLayer || !containsLayer(currentLayer, event.layer)) return;

            console.info("[Creatio GeoJSON] Geometría eliminada desde Geoman; se limpiará BANGeoJson.");
            clearCurrentLayer();
            notifyCreatioToClear();
            resetMapView();
        });

        // Conserva el protocolo existente y solicita el campo correcto de Creatio.
        setTimeout(() => {
            postToCreatio({
                type: "get_polygon",
                fieldName: GEOJSON_FIELD
            });
        }, 2000);
    </script>
</body>
</html>
